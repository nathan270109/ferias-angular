<form (submit)="cadastrarProduto($event)">

    <h2>Produtos</h2>

    <!-- Titulo -->
    <input type="text" placeholder="Titulo" [formField]="produtoForm.titulo">

    <!-- Descrição -->
    <input type="text" placeholder="Descrição" [formField]="produtoForm.descricao">

    <!-- Preço -->
    <input type="text" inputmode="numeric" placeholder="Preço" [formField]="produtoForm.preco">

    <button>Cadastrar produto</button>

</form> 


<div class="produtos">

    @for (produto of produtos(); track produto.titulo) {
        <div>
            <p>{{produto.titulo}}</p>
            <p>{{produto.descricao}}</p>
            <p>{{produto.preco}}</p>
        </div>
    } @empty {
        <p>Não há itens disponivel</p>
    }

</div>
